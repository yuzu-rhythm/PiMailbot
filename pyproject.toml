[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-discord-mailbot"
version = "0.1.0"
description = "Personal Gmail triage, Discord workflows and a Raspberry Pi desk dashboard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "yuzu-rhythm"}]
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.3,<3"]
gmail-auth = ["google-auth-oauthlib>=1.2,<2"]

[project.scripts]
mailbot = "mailbot.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailbot = ["dashboard_static/*.html", "dashboard_static/*.css", "dashboard_static/*.js"]
